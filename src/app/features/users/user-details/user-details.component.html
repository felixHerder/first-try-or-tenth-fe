<!--Details-->
<div nz-flex nzJustify="space-between">
  <h2>Trainee Profile</h2>
  <button class="btn-right-top" nz-button nzType="primary" nzDanger nzSize="large" (click)="openDeleteModal()">Delete
  </button>
</div>

<!--Delete Modal-->
<nz-modal [(nzVisible)]="isDeleteVisible" nzTitle="Delete Instructor" (nzOnCancel)="onDeleteCancel()"
          (nzOnOk)="onDeleteOk()">
  <ng-container *nzModalContent>
    <p>Are you sure you want to delete
      <b>{{ userForm.getRawValue().username }}</b>?
    </p>
  </ng-container>
</nz-modal>

<!--Form-->
<form nz-form nzLayout="vertical" [formGroup]="userForm" (ngSubmit)="submitForm()">
  <div nz-row [nzGutter]="16">
    <!--  Username  -->
    <div nz-col [nzSpan]="12">
      <nz-form-item>
        <nz-form-label nzRequired nzFor="username">Username</nz-form-label>
        <nz-form-control>
          <input nz-input formControlName="username" id="username">
        </nz-form-control>
      </nz-form-item>
    </div>
    <!--  Password  -->
    <div nz-col [nzSpan]="12">
      <nz-form-item>
        <nz-form-label nzRequired nzFor="password">Password</nz-form-label>
        <nz-form-control>
          <nz-input-password>
            <nz-icon nzInputPrefix nzType="lock"/>
            <input nz-input formControlName="password" id="password">
          </nz-input-password>
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
  <div nz-row formGroupName="profile" [nzGutter]="16">
    <!--  Name  -->
    <div nz-col [nzSpan]="12">
      <nz-form-item>
        <nz-form-label nzRequired nzFor="name">Name</nz-form-label>
        <nz-form-control>
          <input nz-input formControlName="name" id="name">
        </nz-form-control>
      </nz-form-item>
    </div>
    <!--  Phone Number  -->
    <div nz-col [nzSpan]="12">
      <nz-form-item>
        <nz-form-label nzRequired nzFor="phoneNumber">Phone number</nz-form-label>
        <nz-form-control>
          <input nz-input formControlName="phoneNumber" id="phoneNumber">
        </nz-form-control>
      </nz-form-item>
    </div>
    <!--  Address -->
    <div nz-col [nzSpan]="12">
      <nz-form-item>
        <nz-form-label nzFor="address">Address</nz-form-label>
        <nz-form-control>
          <input nz-input formControlName="address" id="address">
        </nz-form-control>
      </nz-form-item>
    </div>
  </div>
  <nz-form-item>
    <nz-form-control>
      <button nz-button nzType="primary" nzSize="large" [disabled]="userForm.invalid">Save</button>
    </nz-form-control>
  </nz-form-item>
</form>
