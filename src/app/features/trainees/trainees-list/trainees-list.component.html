<div nz-flex nzJustify="space-between">
  <div>
    <h2 nz-typography>Trainee List</h2>
    <p nz-typography>List of all active trainees registered at the school.</p>
  </div>
  <button nz-button nzSize="large" nzType="primary" [routerLink]="['/', AppRouteConfig.TRAINEES.path, 'new']">Add
    Trainee
    <nz-icon nzType="plus"></nz-icon>
  </button>
</div>
<app-trainees-table [trainees]="trainees()" [loading]="loading()" [pageSize]="10"></app-trainees-table>
